[package]
name = "sunracer-client"
version = "0.3.1"
description = "SunRacer desktop client for the authoritative Elixir space MMO"
authors = ["SunRacer contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Already present transitively in Cargo.lock; direct dependencies for the
# opt-in, TLS-only Tauri -> phone LAN probe. Never enable plaintext fallback.
tokio = { version = "1.54", features = ["net", "io-util", "time", "sync"] }
tokio-rustls = "0.26"
ring = "0.17"
subtle = "2.6"
