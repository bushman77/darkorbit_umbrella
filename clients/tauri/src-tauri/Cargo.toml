[package]
name = "space-nova-client"
version = "0.3.1"
description = "Space Nova desktop client for the authoritative Elixir space MMO"
authors = ["Space Nova contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
