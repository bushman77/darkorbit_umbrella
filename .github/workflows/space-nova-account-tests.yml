name: Validate Space Nova pilot registration and verification

on:
  push:
    branches: [sbs]
    paths:
      - "apps/darkorbit/lib/darkorbit/accounts/**"
      - "apps/darkorbit/lib/darkorbit/accounts.ex"
      - "apps/darkorbit/lib/darkorbit/mailer.ex"
      - "apps/darkorbit/lib/darkorbit/email/**"
      - "apps/darkorbit/test/darkorbit/email/**"
      - "apps/darkorbit/mix.exs"
      - "mix.lock"
      - "config/runtime.exs"
      - "apps/darkorbit/test/darkorbit/accounts_test.exs"
      - "apps/darkorbit/test/support/fixtures/accounts_fixtures.ex"
      - "apps/darkorbit_web/lib/darkorbit_web/controllers/registration_controller.ex"
      - "apps/darkorbit_web/lib/darkorbit_web/controllers/registration_html/**"
      - "apps/darkorbit_web/lib/darkorbit_web/registration_email.ex"
      - "apps/darkorbit_web/lib/darkorbit_web/router.ex"
      - "apps/darkorbit_web/test/darkorbit_web/controllers/registration_controller_test.exs"
      - ".github/workflows/space-nova-account-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darkorbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"
      - name: Fetch dependencies
        run: mix deps.get
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Verify account lifecycle and registration recovery
        run: |
          mix test apps/darkorbit/test/darkorbit/email/probe_test.exs
          mix test apps/darkorbit/test/darkorbit/accounts_test.exs
          mix test apps/darkorbit_web/test/darkorbit_web/controllers/registration_controller_test.exs
          mix test apps/darkorbit_web/test/darkorbit_web/controllers/session_controller_test.exs
      - name: Check production SMTP runtime (no email sent)
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://postgres:postgres@127.0.0.1/darkorbit_test
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: spacenova.ddns.net
          SPACE_NOVA_PROXY_MODE: 'true'
          SPACE_NOVA_EMAIL_PROVIDER: smtp
          SMTP_HOST: smtp.example.test
          SMTP_PORT: '587'
          SMTP_USERNAME: ci-smtp-user
          SMTP_PASSWORD: ci-not-a-real-secret
          REGISTRATION_FROM_EMAIL: noreply@example.test
          SPACE_NOVA_REGISTRATION_OPEN: 'false'
        run: |
          mix run --no-start -e '
            cfg = Application.fetch_env!(:darkorbit, Darkorbit.Mailer)
            unless cfg[:adapter] == Swoosh.Adapters.SMTP and
                   cfg[:tls] == :always and cfg[:tls_options][:verify] == :verify_peer and
                   cfg[:tls_options][:depth] == 10 and
                   cfg[:tls_options][:versions] == [:"tlsv1.2", :"tlsv1.3"] and
                   cfg[:tls_options][:server_name_indication] == ~c"smtp.example.test" and
                   is_list(cfg[:tls_options][:cacerts]) and
                   cfg[:port] == 587 and
                   Application.get_env(:darkorbit_web, :email_delivery_configured) == true and
                   Application.get_env(:darkorbit_web, :registration_email_enabled) == false do
              raise "SMTP transport misconfigured or registration accidentally enabled"
            end
            IO.puts("SMTP runtime verified; public signup remains closed")
          '
          SMTP_PORT=465 mix run --no-start -e '
            cfg = Application.fetch_env!(:darkorbit, Darkorbit.Mailer)
            unless cfg[:adapter] == Swoosh.Adapters.SMTP and
                   cfg[:port] == 465 and cfg[:ssl] == true and
                   cfg[:sockopts][:verify] == :verify_peer and
                   cfg[:sockopts][:depth] == 10 and
                   cfg[:sockopts][:versions] == [:"tlsv1.2", :"tlsv1.3"] do
              raise "Implicit TLS 465 socket verification is misconfigured"
            end
            IO.puts("Implicit TLS options verified")
          '
