name: Build Space Nova Linux client

on:
  push:
    branches: [native_client]
    paths:
      - "clients/tauri/**"
      - "apps/darkorbit_web/assets/js/game/**"
      - "apps/darkorbit_web/assets/js/native_game.js"
      - "apps/darkorbit_web/lib/darkorbit_web/controllers/game_html/show.html.heex"
      - "apps/darkorbit_web/assets/css/app.css"
      - "config/config.exs"
      - "apps/darkorbit_web/assets/package-lock.json"
      - "apps/darkorbit_web/priv/static/images/game/**"
      - ".github/workflows/sbs-tauri-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out native_client source
        uses: actions/checkout@v4

      - name: Install WebKitGTK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: clients/tauri
        run: npm install

      - name: Set up Elixir/OTP for local game asset compilation
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install shared renderer dependencies
        run: npm ci --prefix apps/darkorbit_web/assets

      - name: Test launcher URL validation
        working-directory: clients/tauri
        run: npm test

      - name: Build Linux desktop installers
        working-directory: clients/tauri
        run: npm run build

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: space-nova-linux-x86_64
          if-no-files-found: error
          path: |
            clients/tauri/src-tauri/target/release/bundle/deb/*.deb
            clients/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
