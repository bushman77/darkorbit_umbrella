name: Build Space Nova Linux client

on:
  push:
    branches: [sbs]
    paths:
      - "clients/tauri/**"
      - ".github/workflows/sbs-tauri-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out SBS source
        uses: actions/checkout@v4

      - name: Install WebKitGTK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: clients/tauri
        run: npm install

      - name: Test launcher URL validation
        working-directory: clients/tauri
        run: npm test

      - name: Build Linux desktop installers
        working-directory: clients/tauri
        run: npm run build

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: space-nova-linux-x86_64
          if-no-files-found: error
          path: |
            clients/tauri/src-tauri/target/release/bundle/deb/*.deb
            clients/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
