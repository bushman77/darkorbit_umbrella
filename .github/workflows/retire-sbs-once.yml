name: Retire superseded SBS development branch
on:
  push:
    branches: [native_client]
    paths:
      - ".github/workflows/retire-sbs-once.yml"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-24.04
    if: github.repository == 'bushman77/darkorbit_umbrella'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preserved history and delete old SBS ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          native_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/native_client" --jq '.object.sha')"
          sbs_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/sbs" --jq '.object.sha')"
          [[ "$native_sha" == "$GITHUB_SHA" ]]
          [[ "$sbs_sha" == 301927ed01a710a5cadcbdfbcded39f9f1a5a43a ]]
          git fetch --no-tags origin main sbs native_client
          git merge-base --is-ancestor "$sbs_sha" "$main_sha"
          git merge-base --is-ancestor "$sbs_sha" "$native_sha"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/sbs"
          echo "SBS branch retired; history is preserved on main and native_client."
