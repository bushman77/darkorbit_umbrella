name: Build Space Nova Windows installer

on:
  push:
    branches: [native_client]
    paths:
      - "clients/tauri/**"
      - "apps/darkorbit_web/assets/js/game/**"
      - "apps/darkorbit_web/assets/js/native_game.js"
      - "apps/darkorbit_web/lib/darkorbit_web/controllers/game_html/show.html.heex"
      - "apps/darkorbit_web/assets/css/app.css"
      - "config/config.exs"
      - "apps/darkorbit_web/assets/package-lock.json"
      - "apps/darkorbit_web/priv/static/images/game/**"
      - ".github/workflows/space-nova-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - name: Check out native_client source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Windows Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: clients/tauri
        run: npm install

      - name: Set up Elixir/OTP for local game asset compilation
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install shared renderer dependencies
        run: npm ci --prefix apps/darkorbit_web/assets

      - name: Test launcher
        working-directory: clients/tauri
        run: npm test

      - name: Generate Windows ICO from existing Space Nova PNG
        working-directory: clients/tauri
        run: npm exec -- tauri icon src-tauri/icons/128x128.png

      - name: Build Windows NSIS installer
        working-directory: clients/tauri
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: space-nova-windows-x86_64
          if-no-files-found: error
          path: clients/tauri/src-tauri/target/release/bundle/nsis/*.exe
