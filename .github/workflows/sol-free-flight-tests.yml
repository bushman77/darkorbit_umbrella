name: Verify SOL free-flight mechanics

on:
  push:
    branches: [main, star_base]
    paths:
      - "apps/core/lib/core/universe/navigation.ex"
      - "apps/core/lib/core/universe/green_starbase.ex"
      - "apps/core/test/core/universe/green_starbase_test.exs"
      - "apps/core/lib/core/universe/navigation/checkpoint.ex"
      - "apps/core/lib/core/universe/trade_lanes.ex"
      - "apps/core/lib/core/universe/traffic.ex"
      - "apps/core/lib/core/factions.ex"
      - "apps/core/test/core/factions_test.exs"
      - "apps/core/lib/core/universe/encounters.ex"
      - "apps/core/lib/core/world/supervisor.ex"
      - "apps/core/test/core/universe/trade_lanes_test.exs"
      - "apps/core/test/core/universe/encounters_test.exs"
      - "apps/core/test/core/universe/traffic_test.exs"
      - "apps/core/lib/core/universe/free_flight_region.ex"
      - "apps/core/lib/core/world.ex"
      - "apps/core/lib/core/world/supervisor.ex"
      - "apps/core/lib/core/world/map_server.ex"
      - "apps/core/lib/core/world/station_safety.ex"
      - "apps/core/lib/core/world/green_starbase_safety.ex"
      - "apps/core/test/core/world/green_starbase_safety_test.exs"
      - "apps/core/test/core/world/green_starbase_impact_integration_test.exs"
      - "apps/core/lib/core/universe/orbital_entry.ex"
      - "apps/core/test/core/world/station_safety_test.exs"
      - "apps/core/test/core/universe/orbital_entry_test.exs"
      - "apps/core/test/core/universe/space_bases_test.exs"
      - "apps/core/test/core/world/station_impact_integration_test.exs"
      - "apps/darkorbit_web/assets/js/game/station_warning*.mjs"
      - "apps/core/test/core/universe/navigation_test.exs"
      - "apps/core/test/core/universe/free_flight_region_test.exs"
      - "apps/core/test/core/world/world_test.exs"
      - "apps/darkorbit/test/darkorbit/world_test.exs"
      - "apps/darkorbit/lib/darkorbit/world.ex"
      - "apps/darkorbit/lib/darkorbit/pilot_location.ex"
      - "apps/darkorbit/test/darkorbit/pilot_location_test.exs"
      - "apps/darkorbit_web/lib/darkorbit_web/channels/world_channel.ex"
      - "apps/darkorbit_web/lib/darkorbit_web/channels/helmet_channel.ex"
      - "apps/darkorbit_web/lib/darkorbit_web/controllers/helmet_html/show.html.heex"
      - "apps/darkorbit_web/test/darkorbit_web/channels/helmet_channel_test.exs"
      - "apps/darkorbit_web/assets/js/game/helmet_client.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_control.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_alignment_keys.mjs"
      - "apps/darkorbit_web/assets/js/game/stereo_view.js"
      - "apps/darkorbit_web/assets/js/game/green_starbase_visual.js"
      - "apps/darkorbit_web/assets/js/game/green_starbase_visual_test.mjs"
      - "apps/darkorbit_web/assets/js/game/solar_atlas.mjs"
      - "apps/darkorbit_web/assets/js/game/solar_atlas_test.mjs"
      - "apps/darkorbit_web/assets/js/game/ambient_refinery_traffic*.mjs"
      - "apps/darkorbit_web/assets/js/game/stereo_viewport.mjs"
      - "apps/darkorbit_web/assets/js/game/stereo_viewport_test.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_alignment_keys_test.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_keyboard_only_test.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_planetary_navigation*.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_screen_wake*.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_encounter_view.mjs"
      - "apps/darkorbit_web/assets/js/game/planetary_body.js"
      - "apps/darkorbit_web/test/darkorbit_web/channels/world_channel_test.exs"
      - "apps/darkorbit_web/assets/js/game/navigation_computer.mjs"
      - "apps/darkorbit_web/assets/js/game/client.js"
      - "apps/darkorbit_web/assets/js/game/solar_atlas_view_test.mjs"
      - "apps/darkorbit_web/assets/js/game/orbital_regions_test.mjs"
      - ".github/workflows/sol-free-flight-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-flight-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darkorbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch dependencies
        run: mix deps.get
      - name: Compile Elixir test code
        run: mix compile
      - name: Test SOL cruise and headless free-flight
        run: |
          mix test apps/core/test/core/factions_test.exs
          mix test apps/core/test/core/universe/trade_lanes_test.exs
          mix test apps/core/test/core/universe/encounters_test.exs
          mix test apps/core/test/core/universe/traffic_test.exs
          mix test apps/core/test/core/universe/navigation_test.exs
          mix test apps/core/test/core/universe/green_starbase_test.exs
          mix test apps/core/test/core/universe/free_flight_region_test.exs
          mix test apps/core/test/core/world/world_test.exs
          mix test apps/darkorbit/test/darkorbit/world_test.exs
          mix test apps/darkorbit/test/darkorbit/pilot_location_test.exs
          mix test apps/core/test/core/universe/orbital_entry_test.exs
          mix test apps/core/test/core/universe/space_bases_test.exs
          mix test apps/core/test/core/world/planetary_collision_test.exs
          mix test apps/core/test/core/world/station_safety_test.exs
          mix test apps/core/test/core/world/green_starbase_safety_test.exs
          mix test apps/core/test/core/world/green_starbase_impact_integration_test.exs
          mix test apps/core/test/core/world/station_impact_integration_test.exs
      - name: Test authenticated Phoenix handoffs
        run: |
          mix test apps/darkorbit_web/test/darkorbit_web/channels/world_channel_test.exs
          mix test apps/darkorbit_web/test/darkorbit_web/channels/helmet_channel_test.exs
      - name: Test navigation controls and map ID validation
        run: |
          node --test apps/darkorbit_web/assets/js/game/solar_atlas_view_test.mjs
          node --test apps/darkorbit_web/assets/js/game/solar_atlas_test.mjs
          node --test apps/darkorbit_web/assets/js/game/green_starbase_visual_test.mjs
          node --test apps/darkorbit_web/assets/js/game/orbital_regions_test.mjs
          node --test apps/darkorbit_web/assets/js/game/stereo_viewport_test.mjs
          node --test apps/darkorbit_web/assets/js/game/helmet_alignment_keys_test.mjs
          node --test apps/darkorbit_web/assets/js/game/helmet_alignment_test.mjs
          node --test apps/darkorbit_web/assets/js/game/helmet_keyboard_only_test.mjs
          node --test apps/darkorbit_web/assets/js/game/helmet_screen_wake_test.mjs
          node --test apps/darkorbit_web/assets/js/game/helmet_planetary_navigation_test.mjs
          node --test apps/darkorbit_web/assets/js/game/helmet_encounter_view_test.mjs
          node --test apps/darkorbit_web/assets/js/game/planetary_body_test.mjs
          node --test apps/darkorbit_web/assets/js/game/ambient_refinery_traffic_test.mjs
          node --test apps/darkorbit_web/assets/js/game/station_warning_test.mjs
